version: '3.8'

services:
  db:
    image: postgres:13
    container_name: shared_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

  kloudteck:
    build: ./kloudteck-site
    container_name: kloudteck_app
    restart: always
    expose:
      - "9000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/db_kloudteck
      - SECRET_KEY=${SECRET_KEY_A}

  mikrotik:
    build: ./mikrotik-site
    container_name: mikrotik_app
    restart: always
    expose:
      - "9000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/db_mikrotik
      - SECRET_KEY=${SECRET_KEY_B}

  # --- App 3: NetMonitor (Network Monitoring Dashboard) ---
  netmonitor:
    build: ./netmonitor-site
    container_name: netmonitor_app
    restart: always
    expose:
      - "3000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/db_netmonitor
      - SECRET_KEY=${SECRET_KEY_C}
    # ICMP ping er jonno required capabilities
    cap_add:
      - NET_RAW
      - NET_ADMIN
    sysctls:
      - net.ipv4.ping_group_range=0 2147483647
    volumes:
      - ./netmonitor-site/uploads:/app/uploads

  nginx:
    image: nginx:latest
    container_name: gateway_nginx
    restart: always
    ports:
      - "80:80"
      - "8080:8080" 
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - kloudteck
      - mikrotik
      - netmonitor

volumes:
  postgres_data: