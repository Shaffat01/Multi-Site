<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KloudTeck Admin | Create Account</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #0b0e14;
            --bg-card: #161b22;
            --teal: #00d2d2;
            --teal-dim: rgba(0, 210, 210, 0.15);
            --teal-glow: rgba(0, 210, 210, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #e6edf3;
            --text-secondary: #8b949e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-deep);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-animation .circle {
            position: absolute;
            border-radius: 50%;
            background: var(--teal);
            opacity: 0.03;
            animation: floatCircle 20s infinite ease-in-out;
        }

        .bg-animation .circle:nth-child(1) { width: 600px; height: 600px; top: -200px; left: -100px; }
        .bg-animation .circle:nth-child(2) { width: 400px; height: 400px; bottom: -150px; right: -100px; animation-delay: -5s; }

        @keyframes floatCircle {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 40px) scale(1.1); }
        }

        .grid-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: linear-gradient(rgba(0, 210, 210, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 210, 210, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        /* Card Style */
        .login-container { position: relative; z-index: 10; width: 100%; max-width: 480px; }

        .login-card {
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .login-logo { text-align: center; margin-bottom: 30px; }
        .logo-icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--teal), #0099cc);
            border-radius: 16px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1.4rem; color: white; margin-bottom: 15px;
            box-shadow: 0 8px 20px var(--teal-glow);
        }

        .login-logo h1 { font-size: 1.4rem; font-weight: 800; color: var(--teal); letter-spacing: 2px; }
        .login-logo p { color: var(--text-secondary); font-size: 0.85rem; }

        /* Form Inputs */
        .form-group { margin-bottom: 20px; }
        .form-label-custom { color: var(--text-secondary); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; }
        
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 0.9rem; transition: 0.3s; }

        .form-input {
            width: 100%; padding: 12px 16px 12px 45px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 12px; color: var(--text-main);
            font-size: 0.9rem; transition: 0.3s; outline: none;
        }

        .form-input:focus { border-color: var(--teal); background: rgba(0, 210, 210, 0.05); }
        .form-input:focus + i { color: var(--teal); }

        /* Button */
        .btn-register {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--teal), #0099cc);
            border: none; border-radius: 12px;
            color: white; font-size: 0.95rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1.5px;
            cursor: pointer; transition: 0.3s;
        }

        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 10px 25px var(--teal-glow); }

        .back-to-login { text-align: center; margin-top: 25px; font-size: 0.85rem; color: var(--text-secondary); }
        .back-to-login a { color: var(--teal); text-decoration: none; font-weight: 600; }

        /* Flash Messages */
        .flash-message {
            padding: 12px; border-radius: 10px; margin-bottom: 20px;
            font-size: 0.8rem; display: flex; align-items: center; gap: 10px;
        }
        .flash-message.danger { background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.3); color: #f87171; }
        .flash-message.success { background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); color: #22c55e; }
    </style>
</head>
<body>

    <div class="bg-animation"><div class="circle"></div><div class="circle"></div></div>
    <div class="grid-bg"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon"><i class="fas fa-user-plus"></i></div>
                <h1>JOIN KLOUDTECK</h1>
                <p>Request Admin Access</p>
            </div>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash-message {{ category }}">
                            <i class="fas fa-circle-info"></i> {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('register') }}">
                <div class="form-group">
                    <label class="form-label-custom">Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" name="username" class="form-input" placeholder="Choose a username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label-custom">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" name="email" class="form-input" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label-custom">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" class="form-input" placeholder="Create a strong password" required>
                    </div>
                </div>

                <button type="submit" class="btn-register">Submit Request</button>
            </form>

            <div class="back-to-login">
                Already have an account? <a href="{{ url_for('login') }}">Login Here</a>
            </div>
        </div>
    </div>

</body>
</html>
