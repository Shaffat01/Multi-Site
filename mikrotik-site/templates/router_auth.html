<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login - NetAuto Pro</title>
    <!-- Bootstrap 5 & Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-color: #667eea;
        }

        body { 
            background: #f0f2f5; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        /* --- Background Animation Shapes --- */
        .bg-shape {
            position: absolute;
            z-index: -1;
            filter: blur(80px);
            border-radius: 50%;
        }
        .shape-1 { width: 400px; height: 400px; background: rgba(102, 126, 234, 0.2); top: -10%; left: -10%; }
        .shape-2 { width: 300px; height: 300px; background: rgba(118, 75, 162, 0.2); bottom: -5%; right: -5%; }

        /* --- Login Card --- */
        .auth-card { 
            width: 100%;
            max-width: 450px; 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px);
            padding: 45px; 
            border-radius: 32px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.5);
            position: relative;
        }

        .brand-logo {
            width: 70px;
            height: 70px;
            background: var(--primary-gradient);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            color: white;
            font-size: 30px;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .auth-card h3 { font-weight: 800; color: #2d3436; margin-bottom: 10px; }
        .auth-card p { color: #636e72; font-size: 14px; margin-bottom: 35px; }

        /* --- Input Fields --- */
        .form-label { font-weight: 600; font-size: 13px; color: #636e72; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .input-group {
            background: #f8f9ff;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .input-group:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            background: #fff;
        }

        .input-group-text {
            background: transparent;
            border: none;
            padding-left: 20px;
            color: #b2bec3;
        }

        .form-control {
            background: transparent;
            border: none;
            padding: 15px 20px 15px 10px;
            font-weight: 500;
        }

        .form-control:focus {
            background: transparent;
            box-shadow: none;
            border: none;
        }

        /* --- Connect Button --- */
        .btn-connect {
            background: var(--primary-gradient);
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-weight: 700;
            color: white;
            width: 100%;
            margin-top: 15px;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .btn-connect:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(118, 75, 162, 0.3);
            color: white;
        }

        .btn-back {
            color: #b2bec3;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: block;
            text-align: center;
            margin-top: 25px;
            transition: 0.3s;
        }

        .btn-back:hover { color: var(--accent-color); }

        /* --- Alert --- */
        .alert {
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Background Decoration -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="auth-card" data-aos="zoom-in" data-aos-duration="1000">
        <!-- Logo Section -->
        <div class="text-center">
            <div class="brand-logo" data-aos="bounce-in">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h3>Establish Link</h3>
            <p>Enter your MikroTik credentials to securely manage this device.</p>
        </div>

        <!-- Flash Messages for Errors -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-danger mb-4 shadow-sm" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i> {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- Auth Form -->
        <form action="/mikrotik/authenticate" method="POST">
            <div class="mb-1">
                <label class="form-label">Router Endpoint</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-network-wired"></i></span>
                    <input type="text" name="router_ip" class="form-control" placeholder="192.168.88.1" value="{{ target_ip }}" required>
                </div>
            </div>

            <div class="mb-1">
                <label class="form-label">Administrative User</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user-shield"></i></span>
                    <input type="text" name="router_user" class="form-control" placeholder="e.g. admin" required>
                </div>
            </div>

            <div class="mb-1">
                <label class="form-label">Access Token / Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-key"></i></span>
                    <input type="password" name="router_pass" class="form-control" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn btn-connect shadow">
                <i class="fas fa-bolt me-2"></i> AUTHORIZE & CONNECT
            </button>

            <a href="/" class="btn-back">
                <i class="fas fa-arrow-left me-1"></i> Return to Nodes
            </a>
        </form>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>
</html>
