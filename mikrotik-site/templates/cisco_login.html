<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cisco Login - Network Automation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; }
        .login-card { width: 100%; max-width: 450px; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: white; border-top: 5px solid #007bff; }
        .device-icon { font-size: 3rem; color: #007bff; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="login-card shadow-lg">
            <div class="text-center">
                <i class="fas fa-server device-icon"></i>
                <h3 class="mb-2 text-dark">Cisco SG300 Access</h3>
                <p class="text-muted mb-4">Provide Switch Credentials for SSH Connection</p>
            </div>

            <form action="/cisco/authenticate" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold"><i class="fas fa-network-wired me-2"></i>Switch IP Address</label>
                    <input type="text" name="ip" class="form-control" placeholder="e.g. 192.168.1.10" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold"><i class="fas fa-user me-2"></i>SSH Username</label>
                    <input type="text" name="user" class="form-control" placeholder="Enter username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold"><i class="fas fa-key me-2"></i>SSH Password</label>
                    <input type="password" name="pass" class="form-control" placeholder="Enter password" required>
                </div>
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category }} alert-dismissible fade show small" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="loginBtn">
                    <span id="btnText">Connect to Switch</span>
                    <div id="spinner" class="spinner-border spinner-border-sm d-none" role="status"></div>
                </button>
            </form>
            
            <div class="text-center mt-3">
                <a href="/home" class="text-decoration-none text-secondary small"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
            </div>
        </div>
    </div>

    <script>
        document.querySelector('form').onsubmit = function() {
            document.getElementById('btnText').innerText = "Connecting...";
            document.getElementById('spinner').classList.remove('d-none');
            document.getElementById('loginBtn').disabled = true;
        };
    </script>
</body>
</html>
