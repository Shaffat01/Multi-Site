server {
    listen 80;
    server_name mikrotik.com www.mikrotik.com; # আপনার আসল ডোমেইন এখানে দিন

    location / {
        # 'mikrotik' হলো docker-compose ফাইলে দেওয়া সার্ভিস নেম
        proxy_pass http://mikrotik:9000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files হ্যান্ডেল করার জন্য (Optional but good)
    location /static/ {
        alias /app/static/;
    }
}